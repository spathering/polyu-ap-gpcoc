[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onlinecoc-lan"
version = "0.1.0"
description = "Independent LAN HTTP and WebSocket transport for OnlineCOC"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.5"]

[project.scripts]
onlinecoc-lan = "onlinecoc_lan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
