<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OnlineCOC · 本机首测</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>ONLINECOC / LOCAL PLAYTEST</small><h1>调查室</h1></div><span id="status">尚未连接</span></header><main>
<section id="login-panel"><h2>进入房间</h2><form id="login"><label>账号<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><p>KP 与玩家请使用不同的浏览器配置。首测账号：kp、player1、player2。</p></section>
<div id="workspace" hidden><nav><strong id="identity"></strong><button id="logout">退出</button></nav><div class="grid"><section><h2>角色与物品</h2><div id="entities"></div></section><section><h2>行动</h2><label>动作<select id="actions"></select></label><form id="action-form"><div id="inputs"></div><button id="invoke">执行</button></form><h2>等待回应</h2><div id="waits"></div><h2>个人记录与流程</h2><pre id="progress"></pre></section></div>
<section id="management" hidden><h2>主持人管理</h2><div class="row"><button data-state="active">继续</button><button data-state="paused">暂停</button><button id="backup">保存备份</button><button id="inspect">查看管理信息</button></div><label>导入完整 Lua / JSON 文件组<input type="file" id="rules" accept=".lua,.json" multiple></label><button id="stage">检查并暂存</button><label>规则修订<input id="revision"></label><button id="activate">激活所选修订</button><p>旧流程继续使用原修订。修改内置规则时，请选择完整规则文件组。</p><label>导入素材<input type="file" id="asset"></label><button id="upload">保存素材</button><details><summary>管理命令</summary><label>操作<select id="admin-op"><option>entity.create</option><option>entity.update</option><option>configuration.put</option><option>configuration.remove</option><option>asset.attach</option><option>asset.remove</option><option>flow.retry</option><option>entity.patch</option><option>entity.archive</option><option>relation.set</option><option>relation.remove</option><option>member.update</option><option>progress.set</option><option>flow.cancel</option></select></label><label>参数（JSON）<textarea id="admin-args" rows="5">{}</textarea></label><button id="admin-send">提交管理命令</button></details></section></div>
<section><h2>操作结果</h2><pre id="result" role="status">登录后可查看授权数据。</pre><label>结果未知时查询命令<input id="receipt-id"></label><button id="get-receipt">查询回执</button></section></main><script type="module" src="app.js"></script></body></html>
